# Alembic configuration file

[alembic]
# Path to migration versions
script_location = alembic
# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Prepend sys.path with the backend directory so "app" imports work
prepend_sys_path = .

# SQLAlchemy URL — overridden at runtime from DATABASE_URL env var in env.py
sqlalchemy.url = postgresql://carbon_user:carbon_dev_pass_2026@localhost:5432/carbon_emissions

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
