# PostgreSQL — internal only. No NodePort, no LoadBalancer: nothing outside
# the cluster should be able to open a socket to the database. Reach it for
# debugging with `kubectl port-forward svc/postgres 5432:5432`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: carbon-emissions-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # No storageClassName, so the cluster default is used — on this kind-based
  # cluster that is `standard` (rancher.io/local-path). Its binding mode is
  # WaitForFirstConsumer, so this PVC sits in Pending until the postgres pod
  # is scheduled. That is expected, not a failure.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: carbon-emissions-tracker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: carbon-emissions-tracker
spec:
  replicas: 1
  # The PVC is ReadWriteOnce and Postgres is not clustered here: a rolling
  # update would try to start a second pod holding the same volume before
  # retiring the first. Recreate stops that deadlock before it starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: carbon-emissions-tracker
    spec:
      containers:
        - name: postgres
          image: postgres:16 # same version as docker-compose.yml
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: carbon-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: carbon-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carbon-secrets
                  key: POSTGRES_PASSWORD
            # Postgres refuses to initialise into a directory that is not
            # empty, and a mounted volume can arrive with metadata already
            # in it. Keeping the data one level down sidesteps that.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
