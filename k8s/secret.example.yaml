# TEMPLATE ONLY — this file is committed and must never contain real values.
#
# Copy it to k8s/secret.yaml, replace the placeholders, and apply that.
# k8s/secret.yaml is gitignored precisely so the real one cannot be
# committed by accident:
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # edit k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
#
# stringData (rather than data) means the values are written literally and
# do not need base64 encoding by hand — Kubernetes encodes them on the way
# in. Note that a Secret is only base64-encoded at rest by default, not
# encrypted; this is the right shape for a local single-node cluster, not a
# claim that it is production key management.
apiVersion: v1
kind: Secret
metadata:
  # Deliberately NOT "carbon-secrets" — that is the name the Deployments
  # look for, and this file sits in the same directory that `kubectl apply
  # -f k8s/` sweeps. If this template carried the real name, anyone who ran
  # the apply without first creating k8s/secret.yaml would silently install
  # a stack running on placeholder credentials. With this name, the same
  # mistake fails loudly instead: the pods report
  # `secret "carbon-secrets" not found` and never start.
  #
  # Your copy in k8s/secret.yaml must rename this to `carbon-secrets`.
  name: carbon-secrets-example
  labels:
    app.kubernetes.io/part-of: carbon-emissions-tracker
type: Opaque
stringData:
  # Must match the password inside DATABASE_URL below, and is what the
  # postgres container initialises its superuser with.
  POSTGRES_PASSWORD: replace-with-a-strong-password

  # Full SQLAlchemy connection string. Sensitive because the password is
  # embedded in it. Host/database come from carbon-config; keep them in
  # step if you change either.
  DATABASE_URL: postgresql://carbon_user:replace-with-a-strong-password@postgres:5432/carbon_emissions

  # Signs every JWT. Anyone holding this can mint valid tokens for any
  # user, so treat it like a private key.
  JWT_SECRET_KEY: replace-with-a-long-random-secret
